<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca por CEP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form id="form">
            <label for="CEP">Digite o CEP</label>
            <input type="text" id="cep" name="cep" placeholder="Digite o Cep" required>
            <button type="submit">Buscar</button>
        </form>
        <ul>
            <li> <strong>Logradouro</strong><span id="Logradouro">-</span></li>
            <li> <strong>Bairro</strong><span id="Bairro">-</span></li>
            <li> <strong>Cidade</strong><span id="Cidade">-</span></li>
            <li> <strong>UF</strong><span id="UF">-</span></li>
        </ul>
    </div>
</body>
</html>
